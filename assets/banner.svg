<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="statusbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2130"/>
      <stop offset="100%" stop-color="#171b27"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7dd3fc" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="winClip">
      <rect x="16" y="16" width="1168" height="308" rx="14"/>
    </clipPath>
  </defs>

  <!-- outer background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)" opacity="0.06"/>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="16" y="16" width="1168" height="308" rx="14" fill="#10141f" stroke="#262c3d" stroke-width="1"/>
  </g>

  <g clip-path="url(#winClip)">
    <!-- title bar -->
    <rect x="16" y="16" width="1168" height="38" fill="#161b28"/>
    <line x1="16" y1="54" x2="1184" y2="54" stroke="#262c3d" stroke-width="1"/>

    <circle cx="40" cy="35" r="6" fill="#ff5f56"/>
    <circle cx="60" cy="35" r="6" fill="#ffbd2e"/>
    <circle cx="80" cy="35" r="6" fill="#27c93f"/>

    <text x="600" y="39" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12" fill="#5b6478">krishna@iiit-sricity: ~</text>

    <!-- body -->
    <!-- row 1 : whoami -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.35s" fill="freeze"/>
      <text x="48" y="100" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" fill="#5b6478">krishna@sricity<tspan fill="#5b6478">:~$ </tspan><tspan fill="#7dd3fc">whoami</tspan></text>
    </g>

    <!-- row 2 : name output -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
      <text x="48" y="145" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="34" font-weight="700" fill="#c4b5fd">Krishna Jain</text>
    </g>

    <!-- row 3 : cat role.txt -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.35s" fill="freeze"/>
      <text x="48" y="184" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" fill="#5b6478">krishna@sricity<tspan fill="#5b6478">:~$ </tspan><tspan fill="#7dd3fc">cat</tspan><tspan fill="#5b6478"> role.txt</tspan></text>
    </g>

    <!-- row 4 : role output -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.4s" fill="freeze"/>
      <text x="48" y="212" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" fill="#fbbf24">Full-Stack Engineer · Systems Builder · CS @ IIIT Sri City</text>
    </g>

    <!-- row 5 : status flag -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.15s" dur="0.35s" fill="freeze"/>
      <text x="48" y="250" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" fill="#5b6478">krishna@sricity<tspan fill="#5b6478">:~$ </tspan><tspan fill="#7dd3fc">status</tspan><tspan fill="#5b6478"> --current</tspan></text>
    </g>

    <!-- row 6 : status output + cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.4s" fill="freeze"/>
      <text x="48" y="278" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" fill="#4ade80">&gt; shipping product @ Soundverse AI</text>
      <rect x="368" y="266" width="9" height="16" fill="#4ade80">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" begin="2.95s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- bottom status bar -->
    <rect x="16" y="290" width="1168" height="34" fill="url(#statusbar)"/>
    <line x1="16" y1="290" x2="1184" y2="290" stroke="#262c3d" stroke-width="1"/>
    <text x="38" y="312" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12" fill="#4ade80">⎇ main*</text>
    <text x="1162" y="312" text-anchor="end" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12" fill="#5b6478">B.Tech CSE · IIIT Sri City · GPA 9.3</text>
  </g>
</svg>
